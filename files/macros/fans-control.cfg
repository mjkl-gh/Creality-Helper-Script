########################################
# Fans Control
########################################

[respond]

[duplicate_pin_override]
pins: PC0, PC5, PB2, PC6, ADC_TEMPERATURE


[temperature_fan chamber_fan]
pin: PC0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 70
control: watermark
max_delta: 2
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0


[temperature_fan soc_fan]
pin: PB2
cycle_time: 0.0100
kick_start_time: 0.5
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
control: watermark
max_delta: 2
target_temp: 45.0
max_speed: 1.0
min_speed: 0.0
tachometer_pin:PC6


[gcode_macro M141]
description: Set Chamber Temperature with slicers
gcode:
  {% if 'S' in params|upper %}
    {% if printer["temperature_fan chamber_fan"].speed > 0.0 %}
      SET_PIN PIN=fan1 VALUE=255
    {% else %}
      SET_PIN PIN=fan1 VALUE=0
    {% endif %}
    {% if params.S|int > 0 %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET={params.S|default(35)}
    {% else %}
      SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber_fan TARGET=35
      {% if params.S|int == 0 %}
        SET_PIN PIN=fan1 VALUE=0
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro M191]
description: Wait for Chamber Temperature to heat up (abort with STOP_CHAMBER_HEAT)
variable_target: 0
variable_active: 0
variable_paused: 0
variable_in_print: 0
gcode:
  {% if params.S is not defined %}
    {action_raise_error("M191: missing S parameter")}
  {% endif %}
  {% set s = params.S|float %}
  {% set max_temp = printer.configfile.settings["temperature_fan chamber_fan"].max_temp|float %}
  {% if s > max_temp %}
    {action_raise_error("M191: S%.0f exceeds chamber_fan max_temp of %.0f" % (s, max_temp))}
  {% endif %}
  {% set vars = printer["gcode_macro M191"] %}
  {% set state = printer.print_stats.state %}
  {% set chamber_temp = printer["temperature_fan chamber_fan"].temperature|float %}
  {% set heat = s > 0 and s - 1 > chamber_temp %}
  {% set owns_pause = vars.active|int == 1 and vars.paused|int == 1 and state == "paused" %}
  {% if vars.active|int == 1 and not heat %}
    # replace a running wait whose new target is already satisfied (or S0)
    UPDATE_DELAYED_GCODE ID=_CHAMBER_HEAT_LOOP DURATION=0
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=paused VALUE=0
    M140 S{s if s > 0 else 0}
    RESPOND TYPE=command MSG="Previous chamber wait replaced by M191 S{s}"
    {% if owns_pause %}
      RESUME
    {% endif %}
  {% endif %}
  M141 S{s}
  {% if heat %}
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=target VALUE={s}
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=in_print VALUE={1 if state in ["printing", "paused"] else 0}
    {% if state == "printing" %}
      _CHAMBER_PREPARE_PAUSE
    {% elif state != "paused" and vars.active|int == 0 %}
      _CHAMBER_RAISE_BED
    {% endif %}
    M140 S100
    SET_GCODE_VARIABLE MACRO=M191 VARIABLE=active VALUE=1
    {% if state == "printing" or owns_pause %}
      SET_GCODE_VARIABLE MACRO=M191 VARIABLE=paused VALUE=1
    {% endif %}
    RESPOND TYPE=command MSG="Waiting for the bed to heat up the chamber to {s}°C... (STOP_CHAMBER_HEAT to abort, STOP_CHAMBER_HEAT CONTINUE=1 to skip)"
    {% if state == "printing" %}
      _CHAMBER_PAUSE
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_CHAMBER_HEAT_LOOP DURATION=1
  {% endif %}


[gcode_macro _CHAMBER_RAISE_BED]
description: Home if needed and move the bed close to the nozzle (only when nothing has been printed yet)
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SAVE_GCODE_STATE NAME=_chamber_heat_state
  G90
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=_chamber_heat_state MOVE=0


[gcode_macro _CHAMBER_PREPARE_PAUSE]
description: Raise the bed if the print has not extruded yet, then make the stock RESUME safe for a base pause
gcode:
  {% if printer.print_stats.filament_used|float == 0 %}
    _CHAMBER_RAISE_BED
  {% endif %}
  {% if "gcode_macro PRINTER_PARAM" in printer %}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE=0
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE=0
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=fan2_speed VALUE=0
  {% endif %}
  {% if "gcode_macro PAUSE" in printer and printer.extruder.can_extrude %}
    # matches the extrusion done by the stock RESUME
    SAVE_GCODE_STATE NAME=_chamber_heat_state
    M83
    G1 E-{printer["gcode_macro PAUSE"].extrude|float + 1.0} F2100
    RESTORE_GCODE_STATE NAME=_chamber_heat_state MOVE=0
  {% endif %}


[gcode_macro _CHAMBER_PAUSE]
gcode:
  {% set cfg = printer.configfile.settings %}
  {% if cfg['gcode_macro pause'] is defined %}
    {cfg['gcode_macro pause'].rename_existing|default('PAUSE_BASE')}
  {% else %}
    PAUSE
  {% endif %}


[gcode_macro _CHAMBER_STOP_LOOP]
gcode:
  UPDATE_DELAYED_GCODE ID=_CHAMBER_HEAT_LOOP DURATION=0
  SET_GCODE_VARIABLE MACRO=M191 VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=M191 VARIABLE=paused VALUE=0


[delayed_gcode _CHAMBER_HEAT_LOOP]
gcode:
  {% set vars = printer["gcode_macro M191"] %}
  {% set state = printer.print_stats.state %}
  {% set chamber_temp = printer["temperature_fan chamber_fan"].temperature|float %}
  {% if vars.active|int == 1 %}
    {% if vars.in_print|int == 1 and state not in ["printing", "paused"] %}
      _CHAMBER_STOP_LOOP
      RESPOND TYPE=command MSG="Print no longer active, chamber wait stopped"
    {% elif vars.in_print|int == 0 and state in ["printing", "paused"] %}
      _CHAMBER_STOP_LOOP
      RESPOND TYPE=command MSG="A print was started, chamber preheat wait stopped"
    {% elif vars.paused|int == 1 and state == "printing" %}
      _CHAMBER_STOP_LOOP
      M140 S{vars.target}
      RESPOND TYPE=command MSG="Print resumed manually, chamber wait stopped"
    {% elif chamber_temp >= vars.target|float - 1 %}
      _CHAMBER_STOP_LOOP
      RESPOND TYPE=command MSG="Chamber target temperature reached: {vars.target}°C"
      M140 S{vars.target}
      {% if vars.paused|int == 1 and state == "paused" %}
        RESUME
      {% endif %}
    {% else %}
      UPDATE_DELAYED_GCODE ID=_CHAMBER_HEAT_LOOP DURATION=5
    {% endif %}
  {% endif %}


[gcode_macro STOP_CHAMBER_HEAT]
description: Abort chamber heating started by M191 (CONTINUE=1 resumes the print instead of cancelling it)
gcode:
  {% set vars = printer["gcode_macro M191"] %}
  {% set owns_pause = vars.paused|int == 1 and printer.print_stats.state == "paused" %}
  {% set cont = params.CONTINUE|default(0)|int == 1 %}
  {% if vars.active|int == 0 %}
    RESPOND TYPE=command MSG="No chamber heating in progress"
  {% else %}
    _CHAMBER_STOP_LOOP
    {% if cont %}
      M140 S{vars.target}
      RESPOND TYPE=command MSG="Chamber wait skipped"
      {% if owns_pause %}
        RESUME
      {% endif %}
    {% else %}
      M140 S0
      M141 S0
      RESPOND TYPE=command MSG="Chamber heating aborted"
      {% if owns_pause %}
        CANCEL_PRINT
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro M106]
gcode:
  {% set fans = printer["gcode_macro PRINTER_PARAM"].fans|int %}
  {% set fan = 0 %}
  {% set value = 0 %}
  {% if params.P is defined %}
    {% set tmp = params.P|int %}
    {% if tmp < fans %}
      {% set fan = tmp %}
    {% endif %}
  {% endif %}
  {% if params.S is defined %}
    {% set tmp = params.S|float %}
  {% else %}
    {% set tmp = 255 %}
  {% endif %}
  {% if tmp > 0 %}
    {% if fan == 0 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan0_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan0_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan0_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + value %}
      {% endif %}
    {% endif %}
    {% if fan == 1 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan1_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan1_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan1_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan1_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan1_min + value %}
      {% endif %}
    {% endif %}
    {% if fan == 2 %}
      {% set value = (255 - printer["gcode_macro PRINTER_PARAM"].fan2_min) / 255 * tmp %}
      {% if printer['gcode_macro Qmode'].flag | int == 1 %}
        SET_GCODE_VARIABLE MACRO=Qmode VARIABLE=fan2_value VALUE={printer["gcode_macro PRINTER_PARAM"].fan2_min + value}
        {% if value > (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2  %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + (255 - printer['gcode_macro PRINTER_PARAM'].fan2_min) / 2 %}
        {% else %}
          {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
        {% endif %}
      {% else %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan2_min + value %}
      {% endif %}
    {% endif %}
  {% endif %}
  {% if value >= 255 %}
    {% set value = 255 %}
  {% endif %}
  {% if params.P is defined and params.P|int == 3 %}
    {% set fan = 1 %}
  {% endif %}
  SET_PIN PIN=fan{fan} VALUE={value}
